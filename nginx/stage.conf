# ============================================================================
# NGINX STAGING CONFIGURATION — stage.aroedu.ir
# ============================================================================

upstream django_stage_upstream {
    server web:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name stage.aroedu.ir localhost 127.0.0.1;

    server_tokens off;
    client_max_body_size 100M;

    # Prevent search engines from indexing staging environment
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Let's Encrypt ACME challenge for stage.aroedu.ir
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff
        font/woff2;

    # Django Static Files
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Django Media Uploads
    location /media/ {
        alias /app/media/;
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Django Staging Application Proxy
    location / {
        proxy_pass http://django_stage_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
