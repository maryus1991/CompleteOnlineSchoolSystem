# ============================================================================
# NGINX PRODUCTION CONFIGURATION — aroedu.ir & www.aroedu.ir
# ============================================================================

upstream django_prod_upstream {
    server web:8000;
    keepalive 32;
}

# HTTP Server (Port 80): ACME Let's Encrypt Challenge + Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name aroedu.ir www.aroedu.ir;

    server_tokens off;
    client_max_body_size 100M;

    # Let's Encrypt Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Internal container healthcheck over HTTP
    location = /healthz/ {
        proxy_pass http://django_prod_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect all public HTTP traffic to HTTPS
    location / {
        return 301 https://aroedu.ir$request_uri;
    }
}

# HTTPS Server (Port 443): Primary Production Traffic for aroedu.ir
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aroedu.ir www.aroedu.ir;

    server_tokens off;
    client_max_body_size 100M;

    # SSL Certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/aroedu.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aroedu.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # Redirect www.aroedu.ir -> aroedu.ir
    if ($host = 'www.aroedu.ir') {
        return 301 https://aroedu.ir$request_uri;
    }

    # Django Static Files
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Django Media Uploads (Courses, Profiles, PDFs, Live Recordings)
    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Django Application Proxy
    location / {
        proxy_pass http://django_prod_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
