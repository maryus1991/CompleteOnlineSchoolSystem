[project]
name = "CompleteOnlineSchoolSystem"
version = "0.1.0"
description = "OSS project to build school full system"
readme = "README.md"
authors = [
    { name = "mez", email = "maryus19915123@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "django>=5.2.17",
    "django-ckeditor-5==0.0.6",
    "django-phonenumber-field[phonenumbers]>=8.5.0",
]

[project.scripts]
completeonlineschoolsystem = "completeonlineschoolsystem:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
