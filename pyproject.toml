[project]
name = "CompleteOnlineSchoolSystem"
version = "0.1.0"
description = "OSS project to build school full system"
readme = "README.md"
authors = [
    { name = "mez", email = "maryus19915123@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "django>=5.2.17",
    "django-cachalot>=2.6.3",
    "django-ckeditor-5>=0.2.18",
    "django-debug-toolbar>=8.0.0",
    "django-jalali>=7.4.0",
    "django-phonenumber-field[phonenumbers]>=8.5.0",
    "django-redis>=5.4.0",
    "django-resized>=1.0.3",
    "gunicorn>=23.0.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.2.0",
]

[project.scripts]
completeonlineschoolsystem = "completeonlineschoolsystem:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
