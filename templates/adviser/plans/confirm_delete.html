{% extends "adviser/base.html" %}
{% block main %}
<div style="padding:24px;border-radius:16px;background:var(--bg-card);border:1px solid var(--border-color);max-width:560px;margin:20px auto;text-align:center;">
    <h2 style="margin:0 0 10px;">حذف برنامه مطالعاتی</h2>
    <p style="color:var(--text-secondary);font-size:.9rem;margin-bottom:20px;">
        آیا از غیرفعال‌سازی و حذف برنامه <strong>«{{ plan.title }}»</strong> متعلق به <strong>{{ plan.student.user.get_full_name }}</strong> اطمینان دارید؟
    </p>
    <form method="post" style="display:flex;justify-content:center;gap:12px;">
        {% csrf_token %}
        <button type="submit" style="padding:10px 20px;border-radius:10px;background:#ef4444;color:#fff;border:none;font-weight:700;cursor:pointer;">بله، حذف شود</button>
        <a href="{% url 'adviser:plan-list' %}" style="padding:10px 20px;border-radius:10px;border:1px solid var(--border-color);color:var(--text-primary);text-decoration:none;">انصراف</a>
    </form>
</div>
{% endblock %}
