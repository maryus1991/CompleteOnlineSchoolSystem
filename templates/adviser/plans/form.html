{% extends "adviser/base.html" %}
{% block header %}
{{ form.media }}
<style>
    .plan-form-card { padding: 24px; border-radius: 16px; background: var(--bg-card); border: 1px solid var(--border-color); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 700; font-size: .85rem; }
    .form-group input, .form-group select, .form-group textarea {
        width: 100%; padding: 10px 14px; border-radius: 10px;
        border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); font-family: inherit;
    }
    .btn-primary {
        padding: 11px 22px; border-radius: 12px; background: var(--accent-gradient);
        color: #fff; border: none; font-weight: 700; cursor: pointer;
    }
</style>
{% endblock %}

{% block main %}
<div class="plan-form-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
        <h2 style="margin:0;">{{ page_title|default:"برنامه مطالعاتی" }}</h2>
        <a href="{% url 'adviser:plan-list' %}" style="color:var(--text-secondary);text-decoration:none;font-size:.85rem;">بازگشت به لیست ←</a>
    </div>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<div style="color:#f87171;font-size:.8rem;margin-top:4px;">{{ field.errors }}</div>{% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn-primary">ذخیره و ادامه</button>
    </form>
</div>
{% endblock %}
