{% extends "adviser/base.html" %}
{% block header %}
{{ form.media }}
<style>
    .plan-form-card {
        padding: 24px;
        border-radius: 16px;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
    }
    .plan-form-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 20px;
    }
    .plan-form-header h2 {
        margin: 0;
        font-size: 1.2rem;
        font-weight: 800;
    }
    .plan-field-label {
        display: block;
        margin-bottom: 6px;
        font-weight: 700;
        font-size: .85rem;
        color: var(--text-primary);
    }
    .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 24px;
        border-radius: 12px;
        background: var(--accent-gradient);
        color: #fff;
        border: none;
        font-weight: 700;
        font-size: .88rem;
        cursor: pointer;
    }

    @media (max-width: 768px) {
        .plan-form-card {
            padding: 16px;
            border-radius: 14px;
        }
    }

    @media (max-width: 600px) {
        .plan-form-header {
            flex-direction: column;
            align-items: flex-start;
        }
        .btn-primary {
            width: 100%;
        }
    }
</style>
{% endblock %}

{% block main %}
<div class="plan-form-card">
    <div class="plan-form-header">
        <h2>{{ page_title|default:"برنامه مطالعاتی" }}</h2>
        <a href="{% url 'adviser:plan-list' %}" style="color:var(--text-secondary);text-decoration:none;font-size:.85rem;">بازگشت به لیست ←</a>
    </div>

    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <label class="plan-field-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
            <div class="form-group-glass">
                {{ field }}
                {% if field.errors %}<div style="color:#f87171;font-size:.8rem;margin-top:4px;">{{ field.errors }}</div>{% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn-primary">ذخیره و ادامه</button>
    </form>
</div>
{% endblock %}
