<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="dashboard.pageTitle">داشبورد دانش اموزی</title>
<!--    todo: add name in setting-->
    <meta name="description" content="مدیریت حساب کاربری، دوره‌ها و پیشرفت تحصیلی">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2300f2fe'/%3E%3Cstop offset='100%25' stop-color='%234facfe'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='46' stroke='url(%23g)' stroke-width='5' fill='none'/%3E%3Ccircle cx='50' cy='50' r='14' fill='url(%23g)'/%3E%3C/svg%3E">
    
    <link rel="preload" href="/static/main/fonts/Peyda-Regular.woff" as="font" type="font/woff" crossorigin>
    <link rel="preload" href="/static/main/fonts/Peyda-Bold.woff" as="font" type="font/woff" crossorigin>
    <link rel="preload" href="/static/main/fonts/Peyda-Medium.woff" as="font" type="font/woff" crossorigin>
    <link rel="stylesheet" href="/static/main/fonts/stylesheet.css">
    
    <link rel="stylesheet" href="/static/main/css/main.css">
    <link rel="stylesheet" href="/static/main/css/theme.css">
    <link rel="stylesheet" href="/static/main/css/components.css">
    <link rel="stylesheet" href="/static/main/css/responsive.css">
    <link rel="stylesheet" href="/static/main/css/dashboard.css">
    {% block header %}{% endblock %}

</head>
<body>

    <div class="scroll-progress" id="scrollProgress"></div>

    <div class="preloader" id="preloader">
        <div class="preloader-content">
            <div class="preloader-logo">
                <svg width="50" height="50" viewBox="0 0 100 100" fill="none"><defs><linearGradient id="plGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="50%" stop-color="#4facfe"/><stop offset="100%" stop-color="#f093fb"/></linearGradient></defs><circle cx="50" cy="50" r="46" stroke="url(#plGrad)" stroke-width="3" fill="none" stroke-dasharray="289"><animate attributeName="stroke-dashoffset" from="289" to="0" dur="2s" fill="freeze"/></circle><circle cx="50" cy="50" r="14" fill="url(#plGrad)"><animate attributeName="r" values="10;16;10" dur="2s" repeatCount="indefinite"/></circle></svg>
                <span class="gradient-text">{{site.name}}</span>
            </div>
            <div class="preloader-bar"><div class="preloader-progress"></div></div>
            <div class="preloader-percent">۰٪</div>
        </div>
    </div>

    <!-- پنل تنظیمات حذف شد -->

    <button class="back-to-top" id="backToTop">↑</button>

    <main class="dashboard-premium">
        <div class="container">
            <div class="dashboard-wrapper">
                
                <div class="dashboard-main-content">
                    <div id="dynamicContent">

                        {% block main %}
                        {% endblock %}

                    </div>
                </div>

                <aside class="dashboard-sidebar-right">
                    <div class="sidebar-card profile-card">
                        <div class="profile-avatar-large">
                            {% if user.profile_image %}
                            <img src="{{user.profile_image.url}}" alt="آواتار">
                            {% endif %}
                            <div class="online-dot"></div>

                        </div>
                        <h3 >{{user.get_full_name}}</h3>
                        <h4  dir="ltr" >{{user.PhoneNumber}}</h4>


                    </div>

                    <a href="{% url 'student:account' %}" class="sidebar-menu-item"  >
                        <div class="menu-icon">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </div>
                        <div class="menu-info">
                            <h4 data-i18n="dashboard.editAccount">ویرایش اکانت</h4>
                            <p  ></p>

                        </div>
                        <div class="menu-arrow">→</div>
                    </a>

                    <button class="sidebar-menu-item" data-section="myProducts">
                        <div class="menu-icon">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 7V4a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v13a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/></svg>
                        </div>
                        <div class="menu-info">
                            <h4 data-i18n="dashboard.myProducts">دوره ها</h4>

                        </div>
                        <div class="menu-arrow">→</div>
                    </button>
                    <button class="sidebar-menu-item" data-section="certificates">
                        <div class="menu-icon">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4h16v16H4z M8 8h8v8H8z"/></svg>
                        </div>
                        <div class="menu-info">
                            <h4 data-i18n="dashboard.certificates">ازمون ها</h4>
                        </div>
                        <div class="menu-arrow">→</div>
                    </button>
                    <button class="sidebar-menu-item" data-section="myCourses">
                        <div class="menu-icon">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2a10 10 0 1 0 10 10 10 10 0 0 0-10-10z M12 6v6l4 2"/></svg>
                        </div>
                        <div class="menu-info">
                            <h4 data-i18n="dashboard.myCourses">کارنامه ها</h4>
                        </div>
                        <div class="menu-arrow">→</div>
                    </button>
                    <button class="sidebar-menu-item" data-section="cart">
                        <div class="menu-icon">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                        </div>
                        <div class="menu-info">
                            <h4 data-i18n="nav.cart">مشاوره</h4>
                        </div>
                        <div class="menu-arrow">→</div>
                    </button>
                    <a class="sidebar-menu-item" data-section="support" href="{% url 'student:ticket-list' %}">
                        <div class="menu-icon">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                        </div>
                        <div class="menu-info">
                            <h4 data-i18n="dashboard.support">تیکت</h4>
                        </div>
                        <div class="menu-arrow">→</div>
                    </a>
                                        <a href="/" class="sidebar-menu-item"  >
                        <div class="menu-icon">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ef4444"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4 M16 17l5-5-5-5 M21 12H9"/></svg>
                        </div>
                        <div class="menu-info">
                            <h4 data-i18n="dashboard.editAccount">صفحه اصلی</h4>

                        </div>
                        <div class="menu-arrow">→</div>
                    </a>
                    <a href="{% url 'user:logout' %}" class="sidebar-menu-item logout" data-section="logout">
                        <div class="menu-icon">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ef4444"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4 M16 17l5-5-5-5 M21 12H9"/></svg>
                        </div>
                        <div class="menu-info">
                            <h4 style="color:#ef4444;" data-i18n="dashboard.logout">خروج از حساب</h4>
                        </div>
                        <div class="menu-arrow" style="color:#ef4444;">→</div>
                    </a>
                </aside>
            </div>
        </div>
    </main>




    <script src="/static/main/js/components.js"></script>

    <script>

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.innerHTML = msg;
            toast.style.cssText = 'position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:var(--accent-gradient); color:white; padding:12px 24px; border-radius:50px; z-index:10000; font-weight:600; animation:fadeInUp 0.3s ease;';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

    </script>

    {% block footer %}
    {% endblock %}
</body>
</html>
