{% extends "manager/base.html" %}
{% block main %}
<div class="manager-panel-box">
    <div class="manager-panel-head">
        <h2>مدیریت مجوزها و ظرفیت مشاور «{{ adviser_obj }}»</h2>
        <a href="{% url 'manager:adviser-list' %}" class="manager-btn-outline">بازگشت به لیست مشاوران</a>
    </div>
    <form method="post" class="manager-form">
        {% csrf_token %}
        <div class="manager-form-grid">
            {% for field in form %}
            <div class="manager-form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
            </div>
            {% endfor %}
        </div>
        <div style="margin-top:20px;">
            <button type="submit" class="manager-btn">ذخیره مجوزهای مشاور</button>
        </div>
    </form>
</div>
{% endblock %}
