{% extends "manager/base.html" %}
{% block main %}
<div class="manager-panel-box">
    <div class="manager-panel-head">
        <h2>ویرایش اطلاعات حساب مدیر مدرسه</h2>
        <a href="{% url 'manager:main' %}" class="manager-btn-outline">بازگشت به داشبورد</a>
    </div>
    <form method="post" enctype="multipart/form-data" class="manager-form">
        {% csrf_token %}
        <div class="manager-form-grid">
            {% for field in form %}
            <div class="manager-form-group {% if field.name == 'biography' %}full-width{% endif %}">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<small style="color:#ef4444;">{{ field.errors|join:", " }}</small>{% endif %}
            </div>
            {% endfor %}
        </div>
        <div style="margin-top:20px; display:flex; gap:10px;">
            <button type="submit" class="manager-btn">ذخیره تغییرات</button>
        </div>
    </form>
</div>
{% endblock %}
