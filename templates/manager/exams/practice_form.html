{% extends "manager/base.html" %}
{% block main %}
<div class="manager-panel-box">
    <div class="manager-panel-head">
        <h2>{% if is_edit %}ویرایش تمرین «{{ practice_obj.name }}»{% else %}ایجاد تمرین جدید{% endif %}</h2>
        <a href="{% url 'manager:practice-list' %}" class="manager-btn-outline">بازگشت</a>
    </div>
    <form method="post" class="manager-form">
        {% csrf_token %}
        {{ form.media }}
        <div class="manager-form-grid">
            {% for field in form %}
            <div class="manager-form-group {% if field.name == 'description' or field.name == 'selected_students' %}full-width{% endif %}">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
            </div>
            {% endfor %}
        </div>
        <div style="margin-top:20px;">
            <button type="submit" class="manager-btn">ذخیره تمرین</button>
        </div>
    </form>
</div>
{% endblock %}
