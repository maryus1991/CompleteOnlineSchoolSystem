{% extends 'main/Base/Base.html' %}



{% block header %}

    <link rel="stylesheet" href="../../../static/main/css/auth.css">



{% endblock %}

{% block main %}
    <main class="auth-split-page">
        <div class="auth-split-container">


            <!-- سمت راست - فرم -->
            <div class="auth-split-right">
                <div class="auth-card">
                    <div class="auth-logo-small">

                        {{site.logo_svg|safe}}

                        <h1 data-i18n="auth.welcomeTitle">{{site.auth_title}}</h1>

                    </div>

                    <div class="auth-tabs">
                        <button class="auth-tab active" data-tab="login">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M13.8 12H3"/></svg>
                            <span data-i18n="auth.login">ورود</span>
                        </button>
                        <button class="auth-tab" data-tab="register">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
                            <span data-i18n="auth.register">ثبت‌نام</span>
                        </button>
                    </div>

                    <!-- فرم ورود -->
                    <div class="auth-form active" id="loginForm">
                        <div id="loginMessage" class="auth-message"></div>
                        <form id="loginFormElement" action="{% url 'user:login' %}" method="POST">
                            {% csrf_token %}
                            <input type="hidden" name="next" value="{{ next }}">
                            <div class="form-group">
                                {{login_form.phone_number}}
                                <label>
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                                    <span data-i18n="auth.email">شماره</span>
                                </label>
                            </div>
                            <div class="form-group">
                                {{login_form.password}}
                                <label>
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                                    <span data-i18n="auth.password">رمز عبور</span>
                                </label>
                            </div>

                            <button type="submit" class="auth-btn">
                                <span data-i18n="auth.loginBtn">ورود به حساب کاربری</span>
                             </button>
                        </form>



                        <div class="auth-divider"><span data-i18n="auth.or">یا ادامه با</span></div>
                        <div class="social-buttons">
                            <button class="social-btn google-btn" disabled >
                                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                                <span data-i18n="auth.google">گوگل</span>
                            </button>

                        </div>
                    </div>

                    <!-- فرم ثبت‌نام -->
                    <div class="auth-form" id="registerForm">
                        <div id="registerMessage" class="auth-message"></div>
                        <form id="registerFormElement">
                            <div class="form-group">
                                <input type="text" id="regName" placeholder=" " required>
                                <label>
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                    <span data-i18n="auth.fullname">نام و نام خانوادگی</span>
                                </label>
                            </div>
                            <div class="form-group">
                                <input type="email" id="regEmail" placeholder=" " required>
                                <label>
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                                    <span data-i18n="auth.email">ایمیل</span>
                                </label>
                            </div>
                            <div class="form-group">
                                <input style="direction: rtl;" type="tel" id="regPhone" placeholder=" ">
                                <label>
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                                    <span data-i18n="auth.phone">شماره تماس (اختیاری)</span>
                                </label>
                            </div>
                            <div class="form-row">
                                <div class="form-group half">
                                    <input type="password" id="regPassword" placeholder=" " required>
                                    <label>
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                                        <span data-i18n="auth.password">رمز عبور</span>
                                    </label>
                                </div>
                                <div class="form-group half">
                                    <input type="password" id="regConfirmPassword" placeholder=" " required>
                                    <label>
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                                        <span data-i18n="auth.confirmPassword">تکرار رمز</span>
                                    </label>
                                </div>
                            </div>
                            <label class="checkbox-label">
                                <input type="checkbox" id="acceptTerms" required>
                                <span data-i18n="auth.terms"><a href="#">قوانین و مقررات</a> را می‌پذیرم</span>
                            </label>
                            <button type="submit" class="auth-btn">
                                <span data-i18n="auth.registerBtn">ساخت حساب کاربری</span>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                            </button>
                        </form>
                        <div class="auth-divider"><span data-i18n="auth.or">یا ثبت‌نام با</span></div>
                        <div class="social-buttons">
                            <button class="social-btn google-btn" disabled>
                                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                                <span data-i18n="auth.google">گوگل</span>
                            </button>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
{% endblock %}

{% block footer %}

    <script src="../../../static/main/js/auth.js"></script>
{% endblock %}
