{% extends "teacher/base.html" %}

{% block header %}
<style>
    .article-delete-page {
        width: 100%;
        padding: 10px;
    }

    .article-delete-card {
        max-width: 520px;
        margin: 40px auto;
        padding: 28px 24px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        background: var(--bg-card);
        text-align: center;
    }

    .article-delete-icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 20px;
        background: rgba(248, 113, 113, .12);
        color: #f87171;
    }

    .article-delete-card h2 {
        margin: 0 0 10px;
        color: var(--text-primary);
        font-size: 1.2rem;
        font-weight: 800;
    }

    .article-delete-card p {
        margin: 0 0 8px;
        color: var(--text-secondary);
        font-size: .82rem;
        line-height: 1.9;
    }

    .article-delete-name {
        display: inline-block;
        margin: 12px 0 20px;
        padding: 10px 16px;
        border-radius: 12px;
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        color: var(--text-primary);
        font-size: .9rem;
        font-weight: 700;
    }

    .article-delete-warning {
        margin: 0 0 24px;
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(248, 113, 113, .08);
        border: 1px solid rgba(248, 113, 113, .18);
        color: #f87171;
        font-size: .72rem;
        line-height: 1.8;
    }

    .article-delete-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
    }

    .article-back-btn,
    .article-delete-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 44px;
        min-width: 130px;
        padding: 0 18px;
        border-radius: 12px;
        font-family: inherit;
        font-size: .8rem;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        transition: all .2s ease;
    }

    .article-back-btn {
        color: var(--text-secondary);
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
    }

    .article-back-btn:hover {
        color: var(--text-primary);
        border-color: rgba(79, 172, 254, .35);
    }

    .article-delete-btn {
        color: #fff;
        background: linear-gradient(135deg, #f87171, #ef4444);
        border: none;
    }

    .article-delete-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(239, 68, 68, .25);
    }

    @media (max-width: 500px) {
        .article-delete-card {
            margin: 20px 0;
            padding: 22px 16px;
        }

        .article-delete-actions {
            flex-direction: column-reverse;
        }

        .article-back-btn,
        .article-delete-btn {
            width: 100%;
        }
    }
</style>
{% endblock %}


{% block main %}

<div class="article-delete-page">

    <div class="article-delete-card">

        <div class="article-delete-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M3 6h18"/>
                <path d="M8 6V4h8v2"/>
                <path d="M19 6l-1 14H6L5 6"/>
                <path d="M10 11v6M14 11v6"/>
            </svg>
        </div>

        <h2>حذف مقاله</h2>

        <p>آیا از حذف این مقاله مطمئن هستید؟</p>

        <div class="article-delete-name">
            {{ object.name }}
        </div>

        <div class="article-delete-warning">
            این عملیات قابل بازگشت نیست. مقاله و فایل‌های مرتبط با آن به‌طور کامل حذف می‌شوند.
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="article-delete-actions">
                <a href="{% url 'teacher:article-list' %}" class="article-back-btn">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M19 12H5"/>
                        <path d="M12 19l-7-7 7-7"/>
                    </svg>
                    انصراف
                </a>

                <button type="submit" class="article-delete-btn">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M3 6h18"/>
                        <path d="M8 6V4h8v2"/>
                        <path d="M19 6l-1 14H6L5 6"/>
                        <path d="M10 11v6M14 11v6"/>
                    </svg>
                    بله، حذف شود
                </button>
            </div>
        </form>

    </div>

</div>

{% endblock %}
